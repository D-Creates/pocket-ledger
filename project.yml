name: PocketLedger
options:
  bundleIdPrefix: fr.dcreations
  deploymentTarget: { iOS: "18.0", macOS: "15.0", watchOS: "11.0" }
settings:
  base: { MARKETING_VERSION: "1.0", CURRENT_PROJECT_VERSION: "1", DEVELOPMENT_TEAM: "", CODE_SIGN_STYLE: Automatic, SWIFT_VERSION: "6.0", GENERATE_INFOPLIST_FILE: YES, INFOPLIST_KEY_CFBundleDisplayName: "Pocket Ledger", INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO, ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon }
targets:
  PocketLedger:
    type: application
    platform: iOS
    sources: [Shared, iOS, Assets/iOS.xcassets]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: fr.dcreations.pocketledger
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  PocketLedgerMac:
    type: application
    platform: macOS
    sources: [Shared, macOS, Assets/macOS.xcassets]
    settings: { PRODUCT_BUNDLE_IDENTIFIER: fr.dcreations.pocketledger, PRODUCT_NAME: "Pocket Ledger", INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance, ENABLE_APP_SANDBOX: YES }
  PocketLedgerWatch:
    type: application
    platform: watchOS
    sources: [Shared, Watch, Assets/Watch.xcassets]
    settings: { PRODUCT_BUNDLE_IDENTIFIER: fr.dcreations.pocketledger.watchkitapp, INFOPLIST_KEY_WKApplication: YES, INFOPLIST_KEY_WKWatchOnly: YES }
  PocketLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: PocketLedger }]
    settings: { TARGETED_DEVICE_FAMILY: "1,2" }
  PocketLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: PocketLedger }]
    settings: { TEST_TARGET_NAME: PocketLedger, TARGETED_DEVICE_FAMILY: "1,2" }
  PocketLedgerMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies: [{ target: PocketLedgerMac }]
    settings: { TEST_TARGET_NAME: PocketLedgerMac }
  PocketLedgerWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [UITests]
    dependencies: [{ target: PocketLedgerWatch }]
    settings: { TEST_TARGET_NAME: PocketLedgerWatch }
schemes:
  PocketLedger:
    build: { targets: { PocketLedger: all } }
    test: { targets: [PocketLedgerTests, PocketLedgerUITests] }
  PocketLedgerMac:
    build: { targets: { PocketLedgerMac: all } }
    test: { targets: [PocketLedgerMacUITests] }
  PocketLedgerWatch:
    build: { targets: { PocketLedgerWatch: all } }
    test: { targets: [PocketLedgerWatchUITests] }
